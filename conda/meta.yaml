package:
  name: biomc2
  version: "2.0.1"
source:
  path: ..
build:
  number: 0
requirements:
  build:
    - {{ compiler('c') }}
    - autoconf >=2.70
    - automake
    - make
    - python >=3.10
  run:
    - r-base
test:
  requires:
    - python >=3.10
  source_files:
    - tests/regression.py
    - example/
  commands:
    - BIOMC2_BINDIR="$PREFIX/bin" python tests/regression.py
about:
  home: https://github.com/leomrtns/recomb-biomc2
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: Bayesian inference of recombination breakpoints from phylogenetic incongruence
